<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Guiones de Noticiero - Radio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      color: #1a252f;
      margin-bottom: 8px;
    }

    p.subtitulo {
      font-size: 14px;
      color: #666;
    }

    .panel-acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      min-width: 220px;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
    }

    .btn-editado {
      background-color: #2e7d32;
    }

    .btn-editado:hover {
      background-color: #1b5e20;
    }

    .btn-original {
      background-color: #1565c0;
    }

    .btn-original:hover {
      background-color: #0d47a1;
    }

    .btn-sintesis {
      background-color: #e65100;
    }

    .btn-sintesis:hover {
      background-color: #bf360c;
    }

    .btn-enlaces {
      background-color: #6a1b9a;
    }

    .btn-enlaces:hover {
      background-color: #4a148c;
    }

    .btn-copiar {
      background-color: #424242;
      display: none;
      flex: 100%;
    }

    .btn-copiar:hover {
      background-color: #212121;
    }

    .btn:disabled {
      background-color: #b0bec5;
      cursor: not-allowed;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #555;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1565c0;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .contenedor-resultado {
      position: relative;
    }

    textarea {
      width: 100%;
      height: 550px;
      padding: 18px;
      border: 1px solid #cfd8dc;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.5;
      background-color: #fafafa;
      color: #1a252f;
      resize: vertical;
      white-space: pre-wrap;
    }

    textarea:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
    }

    .alerta {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
    }

    .alerta-exito {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .alerta-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Generador de Guiones de Noticiero</h1>
      <p class="subtitulo">Sistema de extracción y procesamiento de noticias para locución en radio</p>
    </header>

    <div class="panel-acciones">
      <button id="btnEditado" class="btn btn-editado" onclick="solicitarGuion('/api/generar-noticiero')">
        📄 Generar Guión Editado
      </button>

      <button id="btnOriginal" class="btn btn-original" onclick="solicitarGuion('/api/generar-guion-original')">
        📰 Generar Guión Original
      </button>

      <button id="btnSintesis" class="btn btn-sintesis" onclick="solicitarGuion('/api/sintesis-prensa')">
        📊 Síntesis de Prensa
      </button>

      <!-- Nuevo Botón para Opción 4 -->
      <button id="btnEnlaces" class="btn btn-enlaces" onclick="solicitarGuion('/api/sintesis-con-enlaces')">
        🔗 Síntesis con Enlaces
      </button>

      <button id="btnCopiar" class="btn btn-copiar" onclick="copiarAlPortapapeles()">
        📋 Copiar Contenido
      </button>
    </div>

    <div id="alerta" class="alerta"></div>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loadingTexto">Raspando portales de noticias y estructurando el contenido...</p>
      <small style="color: #777;">Este proceso puede tomar entre 30 y 60 segundos.</small>
    </div>

    <div class="contenedor-resultado">
      <textarea id="salidaGuion" placeholder="El contenido generado aparecerá en esta área listo para lectura o edición..." readonly></textarea>
    </div>
  </div>

  <script>
    async function solicitarGuion(endpoint) {
      const btnEditado = document.getElementById('btnEditado');
      const btnOriginal = document.getElementById('btnOriginal');
      const btnSintesis = document.getElementById('btnSintesis');
      const btnEnlaces = document.getElementById('btnEnlaces');
      const btnCopiar = document.getElementById('btnCopiar');
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const alerta = document.getElementById('alerta');

      // Interfaz en estado de carga
      btnEditado.disabled = true;
      btnOriginal.disabled = true;
      btnSintesis.disabled = true;
      btnEnlaces.disabled = true;
      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.value = '';
      btnCopiar.style.display = 'none';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (data.exito) {
          salidaGuion.value = data.guion;
          salidaGuion.removeAttribute('readonly'); // Permitir que el usuario edite si quiere
          btnCopiar.style.display = 'flex';
          mostrarAlerta('Contenido generado con éxito.', 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error || 'No se pudo procesar la solicitud.'}`, 'error');
        }

      } catch (error) {
        console.error('Error en la petición:', error);
        mostrarAlerta('Error de conexión con el servidor. Inténtalo de nuevo.', 'error');
      } finally {
        btnEditado.disabled = false;
        btnOriginal.disabled = false;
        btnSintesis.disabled = false;
        btnEnlaces.disabled = false;
        loading.style.display = 'none';
      }
    }

    function copiarAlPortapapeles() {
      const salidaGuion = document.getElementById('salidaGuion');
      
      if (!salidaGuion.value) return;

      salidaGuion.select();
      salidaGuion.setSelectionRange(0, 99999); // Para móviles

      navigator.clipboard.writeText(salidaGuion.value)
        .then(() => {
          mostrarAlerta('¡Contenido copiado al portapapeles!', 'exito');
        })
        .catch(err => {
          mostrarAlerta('No se pudo copiar automáticamente.', 'error');
        });
    }

    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta');
      alerta.innerText = mensaje;
      alerta.className = `alerta alerta-${tipo}`;
      alerta.style.display = 'block';

      setTimeout(() => {
        alerta.style.display = 'none';
      }, 4000);
    }
  </script>
</body>
</html>
