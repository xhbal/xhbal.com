<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Guiones - XHBAL Latitud 93.5 FM</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.4;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    header p {
      color: var(--text-muted);
      font-size: 12px;
    }

    .panel-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .panel-botones button {
      flex: 1 1 calc(33.333% - 8px);
      min-width: 130px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 8px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .btn-opcion-4 { background-color: #0d9488; }
    .btn-opcion-4:hover { background-color: #0f766e; }

    .btn-opcion-5 { background-color: #7c3aed; }
    .btn-opcion-5:hover { background-color: #6d28d9; }

    .btn-opcion-6 { background-color: #b45309; }
    .btn-opcion-6:hover { background-color: #92400e; }

    #loading {
      display: none;
      text-align: center;
      padding: 15px;
      background: #f8fafc;
      border-radius: 4px;
      margin-bottom: 10px;
      border: 1px dashed var(--border);
    }

    .spinner {
      border: 2px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border-left-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 0 auto 6px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .resultado-container {
      margin-top: 10px;
    }

    .resultado-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 400px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background-color: #fafafa;
      resize: vertical;
    }

    /* Contenedor interactivo con casillas exclusivo para titulares */
    #contenedorFiltroCasillas {
      display: none;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #ffffff;
      padding: 12px;
      max-height: 450px;
      overflow-y: auto;
    }

    .grupo-medio {
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .grupo-medio h3 {
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .item-nota {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
    }

    .item-nota input[type="checkbox"] {
      margin-top: 2px;
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    .item-nota label {
      cursor: pointer;
      color: var(--text-main);
    }

    #contenedorOpcion4 {
      display: none;
      width: 100%;
      overflow-x: auto;
    }

    .tabla-excel {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .tabla-excel th {
      background-color: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
    }

    .tabla-excel td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-main);
    }

    .alerta {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      display: none;
      font-weight: 500;
    }
    .alerta.exito { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .alerta.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .btn-secundario {
      background-color: #475569;
      font-size: 11px;
      padding: 4px 10px;
      width: auto;
    }
    .btn-secundario:hover { background-color: #334155; }

    .btn-accion-etapa2 {
      background-color: #059669;
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-size: 12px;
    }
    .btn-accion-etapa2:hover { background-color: #047857; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>XHBAL - Latitud 93.5 FM</h1>
      <p>Panel de automatización y redacción de noticias con Inteligencia Artificial</p>
    </header>

    <div id="alerta" class="alerta"></div>

    <div class="panel-botones">
      <button id="btnEditado" onclick="solicitarGuion('/api/generar-noticiero', false)">
        📋 Guión Editado
      </button>
      <button id="btnOriginal" onclick="solicitarGuion('/api/generar-guion-original', false)">
        🎙️ Guión Extenso
      </button>
      <button id="btnSintesis" onclick="solicitarGuion('/api/sintesis-prensa', false)">
        📰 Síntesis de Prensa
      </button>
      <button id="btnEnlaces" class="btn-opcion-4" onclick="solicitarGuion('/api/sintesis-con-enlaces', true)">
        🔗 Síntesis con Enlaces
      </button>
      <button id="btnBloque" class="btn-opcion-5" onclick="generarGuionPorBloques()">
        ⚡ Guión Express
      </button>
      <button id="btnSintesisFiltro" class="btn-opcion-6" onclick="solicitarSintesisConCasillas()">
        ☑️ Síntesis con Filtro (Casillas)
      </button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loadingTexto" style="font-weight: 600; color: var(--primary); font-size: 12px;">Conectando con portales y analizando contenido...</p>
      
      <div style="width: 100%; max-width: 250px; background-color: #e2e8f0; border-radius: 4px; margin: 6px auto; overflow: hidden; height: 10px;">
        <div id="barraProgreso" style="width: 0%; height: 100%; background-color: var(--accent); transition: width 0.4s ease-in-out; border-radius: 4px;"></div>
      </div>
      <p id="textoPorcentaje" style="font-weight: bold; color: var(--accent); font-size: 12px;">0%</p>
    </div>

    <div class="resultado-container">
      <div class="resultado-header">
        <span id="labelEstado" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Monitoreo de Noticias</span>
        <button id="btnCopiar" class="btn-secundario" style="display: none;" onclick="copiarAlPortapapeles()">
          📋 Copiar Texto
        </button>
      </div>

      <textarea id="salidaGuion" readonly placeholder="Selecciona una opción arriba para comenzar a generar el contenido..."></textarea>
      
      <div id="contenedorOpcion4"></div>
      
      <!-- Contenedor exclusivo para casillas en titulares -->
      <div id="contenedorFiltroCasillas"></div>
    </div>
  </div>

  <script>
    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alerta ${tipo}`;
      alerta.textContent = mensaje;
      alerta.style.display = 'block';
    }

    function copiarAlPortapapeles() {
      const salida = document.getElementById('salidaGuion');
      salida.select();
      document.execCommand('copy');
      mostrarAlerta('¡Texto copiado al portapapeles con éxito!', 'exito');
    }

    function renderizarCasillasFiltro(textoGuion) {
      const contenedor = document.getElementById('contenedorFiltroCasillas');
      contenedor.innerHTML = '<h3 style="margin-bottom: 10px; color: var(--primary); font-size: 13px;">Selecciona los titulares que deseas incluir en el guión:</h3>';

      const lineas = textoGuion.split('\n');
      let medioActual = 'GENERAL';
      let htmlMedioActual = '';
      let hayNotas = false;

      lineas.forEach((linea, index) => {
        let lineaTrim = linea.trim();
        if (lineaTrim === '') return; // Ignorar líneas vacías

        // Detectar si es un encabezado de sección/medio (ej: ### Portal o **Portal**)
        if (lineaTrim.startsWith('###') || (lineaTrim.startsWith('**') && lineaTrim.endsWith('**') && !lineaTrim.includes('http'))) {
          if (hayNotas) {
            htmlMedioActual += `</div>`;
            contenedor.innerHTML += htmlMedioActual;
          }
          medioActual = lineaTrim.replace(/###|\*\*/g, '').trim();
          htmlMedioActual = `
            <div class="grupo-medio">
              <h3>📡 ${medioActual}</h3>
          `;
          hayNotas = false; // Aún no hay notas en este grupo
        } 
        // Detectar únicamente líneas que parezcan titulares reales (ej: empiezan con *, -, o números)
        else if (lineaTrim.startsWith('*') || lineaTrim.startsWith('-') || /^\d+[\.\)]/.test(lineaTrim)) {
          let textoNota = lineaTrim.replace(/^[*\-\d\.\)]+\s*/, '').trim();
          // Descartar si el texto es muy corto o es una URL suelta
          if (textoNota.length > 5 && !textoNota.startsWith('http')) {
            htmlMedioActual += `
              <div class="item-nota">
                <input type="checkbox" id="nota_${index}" value="${escapeHtml(textoNota)}" data-medio="${escapeHtml(medioActual)}">
                <label for="nota_${index}"><strong>${escapeHtml(textoNota)}</strong></label>
              </div>
            `;
            hayNotas = true;
          }
        }
      });

      if (hayNotas) {
        htmlMedioActual += `</div>`;
        contenedor.innerHTML += htmlMedioActual;
        
        // Botón para procesar la segunda etapa con los titulares seleccionados
        contenedor.innerHTML += `
          <button class="btn-accion-etapa2" onclick="generarSegundaEtapaGuion()">
            🎙️ Generar Guión con los Titulares Seleccionados
          </button>
        `;
      } else if (contenedor.innerHTML.includes('grupo-medio')) {
        contenedor.innerHTML += `</div><button class="btn-accion-etapa2" onclick="generarSegundaEtapaGuion()">🎙️ Generar Guión con los Titulares Seleccionados</button>`;
      } else {
        // Fallback por si el formato del texto de la API es plano pero estructurado
        contenedor.innerHTML += `<div style="padding: 10px; font-size: 12px;">${textoGuion}</div>`;
      }
    }

    function escapeHtml(text) {
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function solicitarSintesisConCasillas() {
      const endpoint = '/api/sintesis-filtro';
      const btnSintesisFiltro = document.getElementById('btnSintesisFiltro');
      const btnCopiar = document.getElementById('btnCopiar');
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const contenedorOpcion4 = document.getElementById('contenedorOpcion4');
      const contenedorFiltroCasillas = document.getElementById('contenedorFiltroCasillas');
      const alerta = document.getElementById('alerta');

      const barraProgreso = document.getElementById('barraProgreso');
      const textoPorcentaje = document.getElementById('textoPorcentaje');
      const loadingTexto = document.getElementById('loadingTexto');

      btnSintesisFiltro.disabled = true;
      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.style.display = 'none';
      contenedorOpcion4.style.display = 'none';
      contenedorFiltroCasillas.style.display = 'none';
      btnCopiar.style.display = 'none';

      let porcentajeActual = 0;
      barraProgreso.style.width = '0%';
      textoPorcentaje.innerText = '0%';
      loadingTexto.innerText = 'Cargando síntesis de prensa para selección...';

      const intervaloProgreso = setInterval(() => {
        if (porcentajeActual < 92) {
          porcentajeActual += 5;
          if (porcentajeActual > 92) porcentajeActual = 92;
          barraProgreso.style.width = porcentajeActual + '%';
          textoPorcentaje.innerText = porcentajeActual + '%';
        }
      }, 500);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();

        clearInterval(intervaloProgreso);
        barraProgreso.style.width = '100%';
        textoPorcentaje.innerText = '100%';

        if (data.exito) {
          contenedorFiltroCasillas.style.display = 'block';
          renderizarCasillasFiltro(data.guion || data.guionGenerado);
          mostrarAlerta('Selecciona los titulares que deseas incluir usando las casillas.', 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error || 'No se pudo procesar.'}`, 'error');
        }
      } catch (error) {
        clearInterval(intervaloProgreso);
        mostrarAlerta('Error de conexión con el servidor.', 'error');
      } finally {
        btnSintesisFiltro.disabled = false;
        loading.style.display = 'none';
      }
    }

    function generarSegundaEtapaGuion() {
      const checkboxes = document.querySelectorAll('#contenedorFiltroCasillas input[type="checkbox"]:checked');
      if (checkboxes.length === 0) {
        mostrarAlerta('Por favor selecciona al menos un titular utilizando las casillas.', 'error');
        return;
      }

      let notasSeleccionadas = [];
      checkboxes.forEach(cb => {
        notasSeleccionadas.push(`- [${cb.getAttribute('data-medio')}] ${cb.value}`);
      });

      const contenedorFiltroCasillas = document.getElementById('contenedorFiltroCasillas');
      const salidaGuion = document.getElementById('salidaGuion');
      const btnCopiar = document.getElementById('btnCopiar');

      contenedorFiltroCasillas.style.display = 'none';
      salidaGuion.style.display = 'block';
      salidaGuion.value = `**GUIÓN SELECCIONADO PARA XHBAL (Segunda Etapa)**\n\n` + notasSeleccionadas.join('\n');
      btnCopiar.style.display = 'flex';
      
      mostrarAlerta(`¡Guión preparado con éxito con ${checkboxes.length} titulares seleccionados!`, 'exito');
    }

    async function solicitarGuion(endpoint, esOpcion4) {
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const contenedorOpcion4 = document.getElementById('contenedorOpcion4');
      const contenedorFiltroCasillas = document.getElementById('contenedorFiltroCasillas');
      const btnCopiar = document.getElementById('btnCopiar');
      const alerta = document.getElementById('alerta');

      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.style.display = 'none';
      contenedorOpcion4.style.display = 'none';
      contenedorFiltroCasillas.style.display = 'none';
      btnCopiar.style.display = 'none';

      try {
        const response = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await response.json();
        if (data.exito) {
          if (esOpcion4) {
            contenedorOpcion4.style.display = 'block';
            renderizarOpcion4ComoTablaExcel(data.guion);
            salidaGuion.value = data.guion;
          } else {
            salidaGuion.style.display = 'block';
            salidaGuion.value = data.guion || data.guionGenerado;
          }
          btnCopiar.style.display = 'flex';
          mostrarAlerta('Contenido generado correctamente.', 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error}`, 'error');
        }
      } catch (error) {
        mostrarAlerta('Error de conexión con el servidor.', 'error');
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
