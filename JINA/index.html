<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Guiones - XHBAL Latitud 93.5 FM</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.4;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    header p {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Panel en Flexbox para forzar dos filas exactas de 3 botones */
    .panel-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .panel-botones button {
      flex: 1 1 calc(33.333% - 8px);
      min-width: 130px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 8px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 11px; /* Ajustado para acomodar textos largos sin amontonarse */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .btn-opcion-4 { background-color: #0d9488; }
    .btn-opcion-4:hover { background-color: #0f766e; }

    .btn-opcion-5 { background-color: #7c3aed; }
    .btn-opcion-5:hover { background-color: #6d28d9; }

    /* Estilo explícito para el Botón 6 */
    .btn-opcion-6 { background-color: #b45309; }
    .btn-opcion-6:hover { background-color: #92400e; }

    #loading {
      display: none;
      text-align: center;
      padding: 15px;
      background: #f8fafc;
      border-radius: 4px;
      margin-bottom: 10px;
      border: 1px dashed var(--border);
    }

    .spinner {
      border: 2px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border-left-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 0 auto 6px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .resultado-container {
      margin-top: 10px;
    }

    .resultado-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 400px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background-color: #fafafa;
      resize: vertical;
    }

    #contenedorOpcion4 {
      display: none;
      width: 100%;
      overflow-x: auto;
    }

    .tabla-excel {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .tabla-excel th {
      background-color: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
    }

    .tabla-excel td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-main);
    }

    .tabla-excel tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .tabla-excel tr:hover {
      background-color: #f1f5f9;
    }

    .badge-portal-tabla {
      font-size: 11px;
      font-weight: 700;
      color: #0f766e;
      background: #f0fdfa;
      padding: 3px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      border: 1px solid #ccfbf1;
      display: inline-block;
      white-space: nowrap;
    }

    .titulo-tabla {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 3px;
      font-size: 13px;
    }

    .extracto-tabla {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .btn-enlace-tabla {
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s;
    }

    .btn-enlace-tabla:hover { background-color: #0369a1; }

    .alerta {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      display: none;
      font-weight: 500;
    }
    .alerta.exito { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .alerta.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .btn-secundario {
      background-color: #475569;
      font-size: 11px;
      padding: 4px 10px;
      width: auto;
    }
    .btn-secundario:hover { background-color: #334155; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>XHBAL - Latitud 93.5 FM</h1>
      <p>Panel de automatización y redacción de noticias con Inteligencia Artificial</p>
    </header>

    <div id="alerta" class="alerta"></div>

    <div class="panel-botones">
      <button id="btnEditado" onclick="solicitarGuion('/api/generar-noticiero', false)">
        📋 Guión Editado
      </button>
      <button id="btnOriginal" onclick="solicitarGuion('/api/generar-guion-original', false)">
        🎙️ Guión Extenso
      </button>
      <button id="btnSintesis" onclick="solicitarGuion('/api/sintesis-prensa', false)">
        📰 Síntesis de Prensa
      </button>
      <button id="btnEnlaces" class="btn-opcion-4" onclick="solicitarGuion('/api/sintesis-con-enlaces', true)">
        🔗 Síntesis con Enlaces
      </button>
      <button id="btnBloque" class="btn-opcion-5" onclick="generarGuionPorBloques()">
        ⚡ Guión Express
      </button>
      <!-- Botón 6: Síntesis de prensa con Filtro -->
      <button id="btnSintesisFiltro" class="btn-opcion-6" onclick="solicitarGuion('/api/sintesis-filtro', false)">
        📰 Síntesis de prensa con Filtro
      </button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loadingTexto" style="font-weight: 600; color: var(--primary); font-size: 12px;">Conectando con portales y analizando contenido...</p>
      
      <div style="width: 100%; max-width: 250px; background-color: #e2e8f0; border-radius: 4px; margin: 6px auto; overflow: hidden; height: 10px;">
        <div id="barraProgreso" style="width: 0%; height: 100%; background-color: var(--accent); transition: width 0.4s ease-in-out; border-radius: 4px;"></div>
      </div>
      <p id="textoPorcentaje" style="font-weight: bold; color: var(--accent); font-size: 12px;">0%</p>
    </div>

    <div class="resultado-container">
      <div class="resultado-header">
        <span id="labelEstado" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Monitoreo de Noticias</span>
        <button id="btnCopiar" class="btn-secundario" style="display: none;" onclick="copiarAlPortapapeles()">
          📋 Copiar Texto
        </button>
      </div>

      <textarea id="salidaGuion" readonly placeholder="Selecciona una opción arriba para comenzar a generar el contenido..."></textarea>
      
      <div id="contenedorOpcion4"></div>
    </div>
  </div>

  <script>
    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alerta ${tipo}`;
      alerta.textContent = mensaje;
      alerta.style.display = 'block';
    }

    function copiarAlPortapapeles() {
      const salida = document.getElementById('salidaGuion');
      salida.select();
      document.execCommand('copy');
      mostrarAlerta('¡Texto copiado al portapapeles con éxito!', 'exito');
    }

    function renderizarOpcion4ComoTablaExcel(textoGuion) {
      const contenedor = document.getElementById('contenedorOpcion4');
      contenedor.innerHTML = '';

      const lineas = textoGuion.split('\n');
      let notas = [];
      
      let portalActual = '';
      let tituloNota = '';
      let enlaceNota = '';
      let extractoNota = '';

      function guardarNotaActual() {
        if (tituloNota && portalActual) {
          let enlaceFinal = enlaceNota.replace(/[\[\]]/g, '').trim();
          const portalLimpio = portalActual.replace(/[\[\]]/g, '').trim();
          const portalLower = portalLimpio.toLowerCase();

          if (portalLower.includes('cuarto poder')) {
            enlaceFinal = 'https://www.cuartopoder.mx/';
          } else if (portalLower.includes('alerta chiapas')) {
            enlaceFinal = 'https://alertachiapas.com/';
          } else if (portalLower.includes('el heraldo de chiapas')) {
            enlaceFinal = 'https://www.elheraldodechiapas.com.mx/';
          } else if (portalLower.includes('chiapas paralelo')) {
            enlaceFinal = 'https://www.chiapasparalelo.com/';
          } else if (portalLower.includes('chiapas en contacto')) {
            enlaceFinal = 'https://chiapasencontacto.com/';
          } else if (portalLower.includes('asich')) {
            enlaceFinal = 'https://www.asich.com/';
          } else if (portalLower.includes('la voz del sureste')) {
            enlaceFinal = 'https://diariolavozdelsureste.com/';
          } else if (portalLower.includes('aristegui')) {
            enlaceFinal = 'https://aristeguinoticias.com/';
          } else if (portalLower.includes('animal político')) {
            enlaceFinal = 'https://www.animalpolitico.com/';
          } else if (portalLower.includes('proceso')) {
            enlaceFinal = 'https://www.proceso.com.mx/';
          } else if (portalLower.includes('la jornada')) {
            enlaceFinal = 'https://www.jornada.com.mx/';
          } else if (portalLower.includes('el economista')) {
            enlaceFinal = 'https://eleconomista.com.mx/';
          } else if (portalLower.includes('expansión')) {
            enlaceFinal = 'https://politica.expansion.mx/';
          }

          notas.push({
            portal: portalLimpio,
            titulo: tituloNota.replace(/[\[\]]/g, '').replace(/^[•\-\*]\s*/, '').trim(),
            enlace: enlaceFinal,
            extracto: extractoNota.replace(/[\[\]]/g, '').trim()
          });
        }
        tituloNota = ''; enlaceNota = ''; extractoNota = '';
      }

      lineas.forEach(linea => {
        let lineaTrim = linea.trim();
        let lineaUpper = lineaTrim.toUpperCase();

        if (lineaUpper.startsWith('PORTAL:')) {
          guardarNotaActual();
          portalActual = lineaTrim.replace(/^PORTAL:/i, '').trim();
        } else if (lineaUpper.startsWith('TÍTULO:') || lineaUpper.startsWith('TITULO:')) {
          tituloNota = lineaTrim.replace(/^TÍTULO:/i, '').replace(/^TITULO:/i, '').trim();
        } else if (lineaUpper.startsWith('ENLACE:')) {
          enlaceNota = lineaTrim.replace(/^ENLACE:/i, '').trim();
        } else if (lineaUpper.startsWith('EXTRACTO:')) {
          extractoNota = lineaTrim.replace(/^EXTRACTO:/i, '').trim();
        } else if (lineaTrim !== '') {
          if (!portalActual) {
            portalActual = "GENERAL";
          }
          if (!tituloNota) {
            tituloNota = lineaTrim;
          } else if (!extractoNota) {
            extractoNota = lineaTrim;
          } else {
            extractoNota += ' ' + lineaTrim;
          }
        }
      });
      guardarNotaActual();

      if (notas.length === 0) {
        contenedor.innerHTML = `<div style="padding: 10px; font-size: 12px; background: #fff;">${textoGuion}</div>`;
        return;
      }

      let tablaHtml = `
        <table class="tabla-excel">
          <thead>
            <tr>
              <th style="width: 20%;">Medio / Portal</th>
              <th style="width: 65%;">Titular y Extracto de la Nota</th>
              <th style="width: 15%; text-align: center;">Acción</th>
            </tr>
          </thead>
          <tbody>
      `;

      notas.forEach(nota => {
        let urlLimpia = nota.enlace;
        if (urlLimpia && !urlLimpia.startsWith('http')) {
          urlLimpia = 'https://' + urlLimpia;
        }
        if (!urlLimpia || urlLimpia === 'https://') {
          urlLimpia = `https://www.google.com/search?q=${encodeURIComponent(nota.titulo + ' ' + nota.portal)}`;
        }

        tablaHtml += `
          <tr>
            <td><span class="badge-portal-tabla">📡 ${nota.portal}</span></td>
            <td>
              <div class="titulo-tabla">${nota.titulo}</div>
              <div class="extracto-tabla">${nota.extracto}</div>
            </td>
            <td style="text-align: center; vertical-align: middle;">
              <a href="${urlLimpia}" target="_blank" class="btn-enlace-tabla">
                🔗 Leer nota
              </a>
            </td>
          </tr>
        `;
      });

      tablaHtml += `
          </tbody>
        </table>
      `;

      contenedor.innerHTML = tablaHtml;
    }

    async function solicitarGuion(endpoint, esOpcion4) {
      const btnEditado = document.getElementById('btnEditado');
      const btnOriginal = document.getElementById('btnOriginal');
      const btnSintesis = document.getElementById('btnSintesis');
      const btnEnlaces = document.getElementById('btnEnlaces');
      const btnBloque = document.getElementById('btnBloque');
      const btnSintesisFiltro = document.getElementById('btnSintesisFiltro');
      const btnCopiar = document.getElementById('btnCopiar');
      
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const contenedorOpcion4 = document.getElementById('contenedorOpcion4');
      const alerta = document.getElementById('alerta');

      const barraProgreso = document.getElementById('barraProgreso');
      const textoPorcentaje = document.getElementById('textoPorcentaje');
      const loadingTexto = document.getElementById('loadingTexto');

      btnEditado.disabled = true;
      btnOriginal.disabled = true;
      btnSintesis.disabled = true;
      btnEnlaces.disabled = true;
      btnBloque.disabled = true;
      btnSintesisFiltro.disabled = true;

      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.style.display = 'none';
      contenedorOpcion4.style.display = 'none';
      btnCopiar.style.display = 'none';

      let porcentajeActual = 0;
      barraProgreso.style.width = '0%';
      textoPorcentaje.innerText = '0%';
      loadingTexto.innerText = 'Iniciando conexión con los portales de noticias...';

      const tiempoEstimadoSegundos = 65;
      const totalPasos = (tiempoEstimadoSegundos * 1000) / 650; 
      const incrementoPorPaso = 92 / totalPasos;

      const intervaloProgreso = setInterval(() => {
        if (porcentajeActual < 92) {
          porcentajeActual += incrementoPorPaso;
          if (porcentajeActual > 92) porcentajeActual = 92;

          const porcentajeEntero = Math.floor(porcentajeActual);
          barraProgreso.style.width = porcentajeEntero + '%';
          textoPorcentaje.innerText = porcentajeEntero + '%';

          if (porcentajeEntero > 15 && porcentajeEntero < 40) {
            loadingTexto.innerText = 'Extrayendo y limpiando contenidos...';
          } else if (porcentajeEntero >= 40 && porcentajeEntero < 75) {
            loadingTexto.innerText = 'Analizando información y procesando con IA...';
          } else if (porcentajeEntero >= 75) {
            loadingTexto.innerText = 'Estructurando tabla y finalizando reporte...';
          }
        }
      }, 650);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await response.json();

        clearInterval(intervaloProgreso);
        barraProgreso.style.width = '100%';
        textoPorcentaje.innerText = '100%';
        loadingTexto.innerText = '¡Proceso completado con éxito!';

        if (data.exito) {
          if (esOpcion4) {
            contenedorOpcion4.style.display = 'block';
            renderizarOpcion4ComoTablaExcel(data.guion);
            salidaGuion.value = data.guion;
          } else {
            salidaGuion.style.display = 'block';
            salidaGuion.value = data.guion || data.guionGenerado;
          }
          btnCopiar.style.display = 'flex';
          mostrarAlerta('Contenido generado correctamente.', 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error || 'No se pudo procesar la solicitud.'}`, 'error');
        }

      } catch (error) {
        clearInterval(intervaloProgreso);
        console.error('Error:', error);
        mostrarAlerta('Error de conexión con el servidor local.', 'error');
      } finally {
        setTimeout(() => {
          btnEditado.disabled = false;
          btnOriginal.disabled = false;
          btnSintesis.disabled = false;
          btnEnlaces.disabled = false;
          btnBloque.disabled = false;
          btnSintesisFiltro.disabled = false;
          loading.style.display = 'none';
        }, 800);
      }
    }

    async function generarGuionPorBloques() {
      const btnEditado = document.getElementById('btnEditado');
      const btnOriginal = document.getElementById('btnOriginal');
      const btnSintesis = document.getElementById('btnSintesis');
      const btnEnlaces = document.getElementById('btnEnlaces');
      const btnBloque = document.getElementById('btnBloque');
      const btnSintesisFiltro = document.getElementById('btnSintesisFiltro');
      const btnCopiar = document.getElementById('btnCopiar');
      
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const contenedorOpcion4 = document.getElementById('contenedorOpcion4');
      const alerta = document.getElementById('alerta');

      const barraProgreso = document.getElementById('barraProgreso');
      const textoPorcentaje = document.getElementById('textoPorcentaje');
      const loadingTexto = document.getElementById('loadingTexto');

      btnEditado.disabled = true;
      btnOriginal.disabled = true;
      btnSintesis.disabled = true;
      btnEnlaces.disabled = true;
      btnBloque.disabled = true;
      btnSintesisFiltro.disabled = true;

      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.style.display = 'none';
      contenedorOpcion4.style.display = 'none';
      btnCopiar.style.display = 'none';

      barraProgreso.style.width = '20%';
      textoPorcentaje.innerText = '20%';
      loadingTexto.innerText = 'Iniciando barrido inteligente de los portales...';

      try {
        const response = await fetch('/api/procesar-bloque', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await response.json();

        barraProgreso.style.width = '100%';
        textoPorcentaje.innerText = '100%';
        loadingTexto.innerText = '¡Guión Express completado con éxito!';

        if (data.exito) {
          salidaGuion.style.display = 'block';
          salidaGuion.value = data.guion;
          btnCopiar.style.display = 'flex';
          mostrarAlerta(`Barrido de portales completado (${data.totalPortales} medios procesados).`, 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error || 'No se pudo procesar el barrido.'}`, 'error');
        }
      } catch (err) {
        console.error(err);
        mostrarAlerta('Error de conexión al procesar el Guión Express.', 'error');
      } finally {
        setTimeout(() => {
          btnEditado.disabled = false;
          btnOriginal.disabled = false;
          btnSintesis.disabled = false;
          btnEnlaces.disabled = false;
          btnBloque.disabled = false;
          btnSintesisFiltro.disabled = false;
          loading.style.display = 'none';
        }, 800);
      }
    }
  </script>
</body>
</html>
