<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Guiones - XHBAL Latitud 93.5 FM</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.4;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    header p {
      color: var(--text-muted);
      font-size: 12px;
    }

    .panel-botones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 15px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .btn-opcion-4 { background-color: #0d9488; }
    .btn-opcion-4:hover { background-color: #0f766e; }

    #loading {
      display: none;
      text-align: center;
      padding: 15px;
      background: #f8fafc;
      border-radius: 4px;
      margin-bottom: 10px;
      border: 1px dashed var(--border);
    }

    .spinner {
      border: 2px solid var(--border);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border-left-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 0 auto 6px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .resultado-container {
      margin-top: 10px;
    }

    .resultado-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 400px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background-color: #fafafa;
      resize: vertical;
    }

    #contenedorOpcion4 {
      display: none;
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
    }

    /* Estilo de lista limpia y continua */
    .lista-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .lista-item:last-child {
      border-bottom: none;
    }

    .lista-contenido {
      flex: 1;
    }

    .lista-portal {
      font-size: 10px;
      font-weight: 700;
      color: #0d9488;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 2px;
    }

    .lista-titulo {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .lista-extracto {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .btn-enlace-tabla {
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.2s;
      margin-top: 4px;
    }

    .btn-enlace-tabla:hover { background-color: #0369a1; }

    .alerta {
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      display: none;
      font-weight: 500;
    }
    .alerta.exito { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .alerta.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .btn-secundario {
      background-color: #475569;
      font-size: 11px;
      padding: 4px 10px;
      width: auto;
    }
    .btn-secundario:hover { background-color: #334155; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>XHBAL - Latitud 93.5 FM</h1>
      <p>Panel de automatización y redacción de noticias con Inteligencia Artificial</p>
    </header>

    <div id="alerta" class="alerta"></div>

    <div class="panel-botones">
      <button id="btnEditado" onclick="solicitarGuion('/api/generar-noticiero', false)">
        📋 Guión Editado
      </button>
      <button id="btnOriginal" onclick="solicitarGuion('/api/generar-guion-original', false)">
        🎙️ Guión Extenso
      </button>
      <button id="btnSintesis" onclick="solicitarGuion('/api/sintesis-prensa', false)">
        📰 Síntesis de Prensa
      </button>
      <button id="btnEnlaces" class="btn-opcion-4" onclick="solicitarGuion('/api/sintesis-con-enlaces', true)">
        🔗 Síntesis con Enlaces
      </button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loadingTexto" style="font-weight: 600; color: var(--primary); font-size: 12px;">Conectando con portales y analizando contenido...</p>
      
      <div style="width: 100%; max-width: 250px; background-color: #e2e8f0; border-radius: 4px; margin: 6px auto; overflow: hidden; height: 10px;">
        <div id="barraProgreso" style="width: 0%; height: 100%; background-color: var(--accent); transition: width 0.4s ease-in-out; border-radius: 4px;"></div>
      </div>
      <p id="textoPorcentaje" style="font-weight: bold; color: var(--accent); font-size: 12px;">0%</p>
    </div>

    <div class="resultado-container">
      <div class="resultado-header">
        <span id="labelEstado" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Vista de Resultados</span>
        <button id="btnCopiar" class="btn-secundario" style="display: none;" onclick="copiarAlPortapapeles()">
          📋 Copiar Texto
        </button>
      </div>

      <textarea id="salidaGuion" readonly placeholder="Selecciona una opción arriba para comenzar a generar el contenido..."></textarea>
      
      <div id="contenedorOpcion4"></div>
    </div>
  </div>

  <script>
    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta');
      alerta.className = `alerta ${tipo}`;
      alerta.textContent = mensaje;
      alerta.style.display = 'block';
    }

    function copiarAlPortapapeles() {
      const salida = document.getElementById('salidaGuion');
      salida.select();
      document.execCommand('copy');
      mostrarAlerta('¡Texto copiado al portapapeles con éxito!', 'exito');
    }

    function renderizarOpcion4ComoLista(textoGuion) {
      const contenedor = document.getElementById('contenedorOpcion4');
      contenedor.innerHTML = '';

      const lineas = textoGuion.split('\n');
      let notas = [];
      
      let portalActual = '';
      let tituloNota = '';
      let enlaceNota = '';
      let extractoNota = '';

      function guardarNotaActual() {
        if (tituloNota && portalActual) {
          notas.push({
            portal: portalActual.replace(/[\[\]]/g, '').trim(),
            titulo: tituloNota.replace(/[\[\]]/g, '').replace(/^[•\-\*]\s*/, '').trim(),
            enlace: enlaceNota.replace(/[\[\]]/g, '').trim(),
            extracto: extractoNota.replace(/[\[\]]/g, '').trim()
          });
        }
        tituloNota = ''; enlaceNota = ''; extractoNota = '';
      }

      lineas.forEach(linea => {
        linea = linea.trim();
        if (linea.toUpperCase().startsWith('PORTAL:')) {
          guardarNotaActual();
          portalActual = linea.replace(/^PORTAL:/i, '').replace(/[\[\]]/g, '').trim();
        } else if (linea.toUpperCase().startsWith('TÍTULO:') || linea.toUpperCase().startsWith('TITULO:')) {
          guardarNotaActual();
          tituloNota = linea.replace(/^TÍTULO:/i, '').replace(/^TITULO:/i, '').trim();
        } else if (linea.toUpperCase().startsWith('ENLACE:')) {
          enlaceNota = linea.replace(/^ENLACE:/i, '').trim();
        } else if (linea.toUpperCase().startsWith('EXTRACTO:')) {
          extractoNota = linea.replace(/^EXTRACTO:/i, '').trim();
        } else if (linea !== '') {
          if (extractoNota) {
            extractoNota += ' ' + linea;
          } else if (enlaceNota) {
            enlaceNota += linea;
          } else if (tituloNota) {
            tituloNota += ' ' + linea;
          }
        }
      });
      guardarNotaActual();

      if (notas.length === 0) {
        contenedor.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${textoGuion}</pre>`;
        return;
      }

      let htmlAcumulado = `<div style="font-size: 13px; font-weight: 700; color: #0f766e; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);">📊 Monitoreo General de Noticias en una Sola Lista</div>`;

      notas.forEach(nota => {
        let urlLimpia = nota.enlace;
        if (urlLimpia && !urlLimpia.startsWith('http')) {
          urlLimpia = 'https://' + urlLimpia;
        }
        if (!urlLimpia || urlLimpia === 'https://') {
          urlLimpia = `https://www.google.com/search?q=${encodeURIComponent(nota.titulo + ' ' + nota.portal)}`;
        }

        htmlAcumulado += `
          <div class="lista-item">
            <div class="lista-contenido">
              <span class="lista-portal">${nota.portal}</span>
              <div class="lista-titulo">${nota.titulo}</div>
              <div class="lista-extracto">${nota.extracto}</div>
            </div>
            <a href="${urlLimpia}" target="_blank" class="btn-enlace-tabla">
              🔗 Ver nota
            </a>
          </div>
        `;
      });

      contenedor.innerHTML = htmlAcumulado;
    }

    async function solicitarGuion(endpoint, esOpcion4) {
      const btnEditado = document.getElementById('btnEditado');
      const btnOriginal = document.getElementById('btnOriginal');
      const btnSintesis = document.getElementById('btnSintesis');
      const btnEnlaces = document.getElementById('btnEnlaces');
      const btnCopiar = document.getElementById('btnCopiar');
      
      const loading = document.getElementById('loading');
      const salidaGuion = document.getElementById('salidaGuion');
      const contenedorOpcion4 = document.getElementById('contenedorOpcion4');
      const alerta = document.getElementById('alerta');

      const barraProgreso = document.getElementById('barraProgreso');
      const textoPorcentaje = document.getElementById('textoPorcentaje');
      const loadingTexto = document.getElementById('loadingTexto');

      btnEditado.disabled = true;
      btnOriginal.disabled = true;
      btnSintesis.disabled = true;
      btnEnlaces.disabled = true;

      loading.style.display = 'block';
      alerta.style.display = 'none';
      salidaGuion.style.display = 'none';
      contenedorOpcion4.style.display = 'none';
      btnCopiar.style.display = 'none';

      let porcentajeActual = 0;
      barraProgreso.style.width = '0%';
      textoPorcentaje.innerText = '0%';
      loadingTexto.innerText = 'Iniciando conexión con los portales de noticias...';

      const intervaloProgreso = setInterval(() => {
        if (porcentajeActual < 90) {
          const incremento = Math.max(1, Math.floor((90 - porcentajeActual) / 12));
          porcentajeActual += incremento;
          
          barraProgreso.style.width = porcentajeActual + '%';
          textoPorcentaje.innerText = porcentajeActual + '%';

          if (porcentajeActual > 25 && porcentajeActual < 60) {
            loadingTexto.innerText = 'Extrayendo y limpiando contenidos...';
          } else if (porcentajeActual >= 60) {
            loadingTexto.innerText = 'Procesando y redactando...';
          }
        }
      }, 450);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await response.json();

        clearInterval(intervaloProgreso);
        barraProgreso.style.width = '100%';
        textoPorcentaje.innerText = '100%';
        loadingTexto.innerText = '¡Proceso completado con éxito!';

        if (data.exito) {
          if (esOpcion4) {
            contenedorOpcion4.style.display = 'block';
            renderizarOpcion4ComoLista(data.guion);
            salidaGuion.value = data.guion;
          } else {
            salidaGuion.style.display = 'block';
            salidaGuion.value = data.guion;
          }
          btnCopiar.style.display = 'flex';
          mostrarAlerta('Contenido generado correctamente.', 'exito');
        } else {
          mostrarAlerta(`Error: ${data.error || 'No se pudo procesar la solicitud.'}`, 'error');
        }

      } catch (error) {
        clearInterval(intervaloProgreso);
        console.error('Error:', error);
        mostrarAlerta('Error de conexión con el servidor local.', 'error');
      } finally {
        setTimeout(() => {
          btnEditado.disabled = false;
          btnOriginal.disabled = false;
          btnSintesis.disabled = false;
          btnEnlaces.disabled = false;
          loading.style.display = 'none';
        }, 800);
      }
    }
  </script>
</body>
</html>
